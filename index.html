<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="author" content="Zerra Studios" />

    <!-- Async font loading — avoids render-blocking @import in CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" /></noscript>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Zerra Studios",
      "alternateName": ["Zerra", "Zera Studios", "Zera"],
      "url": "https://zerrastudios.com",
      "logo": "https://zerrastudios.com/logo.png",
      "image": "https://zerrastudios.com/logo.png",
      "description": "Zerra Studios builds high-performance websites that increase conversions, improve SEO rankings, and drive business growth.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Vancouver",
        "addressRegion": "BC",
        "addressCountry": "CA"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@zerrastudios.com",
        "contactType": "customer service"
      },
      "sameAs": [
        "https://instagram.com/zerra.studios"
      ],
      "serviceType": ["Web Design", "Web Development", "Branding", "Motion Design", "SEO", "Online Marketing", "Conversion Rate Optimization", "Website Hosting"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Digital Services",
        "itemListElement": [
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Web Design"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Web Development"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Search Engine Optimization"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Online Marketing"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Conversion Rate Optimization"}},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Website Hosting"}}
        ]
      }
    }
    </script>
    <!--app-head-->
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
